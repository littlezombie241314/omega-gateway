name: Render 保活

on:
  schedule:
    # 每 10 分钟访问一次，保持 Render 不休眠
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: 访问 Render 保持活跃
        run: |
          echo "正在访问 Render 保持服务活跃..."
          curl -s https://universal-equality-ios.onrender.com/api/status > /dev/null
          echo "✅ 已访问，Render 保持唤醒状态"
          echo "时间: $(date)"
